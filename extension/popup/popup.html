<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Vision Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h2>Privacy Vision Agent</h2>
    <span class="badge">SIH 2026 Prototype</span>
  </div>

  <div class="content">
    <div class="actions">
      <button id="inspect-btn" class="primary-btn">Inspect DOM</button>
      <button id="capture-btn" class="secondary-btn">Capture Canvas</button>
      <button id="ocr-btn" class="secondary-btn" disabled>Run Local OCR</button>
      <button id="synthetic-ocr-btn" class="secondary-btn">Test Synthetic OCR</button>
    </div>

    <div id="status-container" class="status-container hidden">
      <div id="status-message">Ready.</div>
    </div>

    <div id="meta-container" class="meta-grid hidden">
      <div class="meta-card">
        <span class="meta-label">Observation ID</span>
        <span id="meta-obs-id" class="meta-value">-</span>
      </div>
      <div class="meta-card">
        <span class="meta-label">DOM Elements</span>
        <span id="meta-elements" class="meta-value">-</span>
      </div>
      <div class="meta-card full-width">
        <span class="meta-label">Title</span>
        <span id="meta-title" class="meta-value">-</span>
      </div>
      <div class="meta-card full-width">
        <span class="meta-label">URL</span>
        <span id="meta-url" class="meta-value">-</span>
      </div>
    </div>

    <div id="canvas-container" class="canvas-container hidden">
      <div class="json-header">
        <span>Canvas Preview & Debug Stats (<span id="canvas-dim">-</span>)</span>
      </div>
      <div id="canvas-debug-stats" class="debug-stats-box">
        <span class="debug-tag">Width: <b id="dbg-width">-</b></span>
        <span class="debug-tag">Height: <b id="dbg-height">-</b></span>
        <span class="debug-tag">Has Data: <b id="dbg-hasdata">-</b></span>
        <span class="debug-tag">Non-Zero Pixels: <b id="dbg-percent">-</b></span>
      </div>
      <div class="preview-box">
        <canvas id="canvas-preview"></canvas>
      </div>
    </div>

    <div class="json-header">
      <span id="output-title">PageState / OCR Output JSON</span>
    </div>
    <div class="json-container">
      <pre id="json-output">// Click "Inspect DOM", "Run Local OCR", or "Test Synthetic OCR" to view results</pre>
    </div>
  </div>

  <script src="../lib/tesseract.min.js"></script>
  <script src="../perception/canvas-processor.js"></script>
  <script src="../perception/ocr-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
